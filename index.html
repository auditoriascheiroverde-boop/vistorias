<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vistorias · Cheiro Verde Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --forest:#1E5B3A;
    --forest-dark:#153F28;
    --moss:#4C7A4E;
    --moss-bg:#E7F0E3;
    --clay:#B23A2E;
    --clay-bg:#F7E7E3;
    --amber:#C98A2C;
    --amber-bg:#F8EDDA;
    --paper:#F5F3EC;
    --paper-raised:#FFFFFF;
    --graphite:#262922;
    --graphite-soft:#5B6055;
    --line:#DEDACB;
    --radius:14px;
    --shadow:0 1px 2px rgba(38,41,34,0.06), 0 4px 14px rgba(38,41,34,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--graphite);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;display:flex;flex-direction:column;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--forest);
    color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-top)/4);
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:10px;
    box-shadow:0 2px 10px rgba(21,63,40,0.25);
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .brand-mark{width:30px;height:30px;flex:none;}
  .brand-text{display:flex;flex-direction:column;line-height:1.05;min-width:0;}
  .brand-text b{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand-text span{font-size:10.5px;letter-spacing:.04em;color:#CFE3D4;text-transform:uppercase;}
  .icon-btn{
    width:36px;height:36px;border-radius:10px;border:none;background:rgba(255,255,255,0.14);
    color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,0.26);}
  .icon-btn svg{width:19px;height:19px;}

  /* ---- Content ---- */
  .content{flex:1;padding:16px 16px 100px;}
  .view-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;margin:2px 0 4px;}
  .view-sub{font-size:13px;color:var(--graphite-soft);margin:0 0 18px;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:6px;margin-bottom:16px;background:#EAE6D8;border-radius:12px;padding:4px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--graphite-soft);cursor:pointer;user-select:none;}
  .tab.active{background:var(--paper-raised);color:var(--forest);box-shadow:var(--shadow);}

  /* ---- Cards ---- */
  .card{
    background:var(--paper-raised);border-radius:var(--radius);box-shadow:var(--shadow);
    margin-bottom:12px;overflow:hidden;position:relative;
  }
  .insp-card{display:flex;gap:12px;padding:14px 14px 14px 12px;cursor:pointer;align-items:center;border-left:5px solid var(--line);}
  .insp-card.st-green{border-left-color:var(--moss);}
  .insp-card.st-amber{border-left-color:var(--amber);}
  .insp-card.st-red{border-left-color:var(--clay);}
  .insp-card:active{background:#FBFAF6;}
  .ring{width:52px;height:52px;flex:none;}
  .insp-info{flex:1;min-width:0;}
  .insp-unit{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15.5px;}
  .insp-meta{font-size:12px;color:var(--graphite-soft);margin-top:2px;}
  .insp-meta .mono{font-size:11.5px;}
  .insp-flags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .chip{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;}
  .chip-red{background:var(--clay-bg);color:var(--clay);}
  .chip-amber{background:var(--amber-bg);color:var(--amber);}
  .chip-green{background:var(--moss-bg);color:var(--moss);}
  .chevron{flex:none;color:var(--line);}

  .empty{text-align:center;padding:60px 20px;color:var(--graphite-soft);}
  .empty svg{width:46px;height:46px;color:var(--line);margin-bottom:12px;}
  .empty p{font-size:14px;margin:4px 0;}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    border:none;border-radius:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;
    padding:12px 18px;cursor:pointer;
  }
  .btn svg{width:17px;height:17px;flex:none;}
  .btn-primary{background:var(--forest);color:#fff;}
  .btn-primary:active{background:var(--forest-dark);}
  .btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--line);}
  .btn-ghost:active{background:#EFEDE2;}
  .btn-danger{background:var(--clay-bg);color:var(--clay);}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .btn-block{width:100%;}
  .fab{
    position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;
    padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 60%, rgba(245,243,236,0));
    z-index:15;
  }

  /* ---- Forms ---- */
  .section{background:var(--paper-raised);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .section-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .section-head h3{font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:700;margin:0;color:var(--forest-dark);text-transform:uppercase;letter-spacing:.02em;}
  .field{padding:13px 15px;border-bottom:1px solid var(--line);}
  .field:last-child{border-bottom:none;}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--graphite-soft);margin-bottom:6px;}
  input[type=text],input[type=date],input[type=datetime-local],textarea,select{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;font-size:14.5px;
    font-family:'Inter',sans-serif;background:#FDFCF9;color:var(--graphite);
  }
  textarea{resize:vertical;min-height:64px;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--forest);outline-offset:1px;border-color:var(--forest);}

  .item{padding:13px 15px;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item-q{font-size:14px;line-height:1.4;margin-bottom:10px;font-weight:500;}
  .seg{display:flex;gap:6px;margin-bottom:8px;}
  .seg-btn{
    flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--line);background:#FDFCF9;
    font-size:13px;font-weight:600;color:var(--graphite-soft);cursor:pointer;text-align:center;
  }
  .seg-btn.on-green{background:var(--moss);border-color:var(--moss);color:#fff;}
  .seg-btn.on-red{background:var(--clay);border-color:var(--clay);color:#fff;}
  .seg-btn.on-gray{background:var(--graphite-soft);border-color:var(--graphite-soft);color:#fff;}
  .item-flag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--clay);margin:6px 0 8px;}
  .item-flag svg{width:14px;height:14px;}
  .obs-input{margin-top:6px;}
  .obs-input input{font-size:13.5px;}
  .item-actions-row{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;}
  .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(20,20,15,0.65);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;cursor:pointer;}
  .photo-add{width:64px;height:64px;border-radius:8px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--graphite-soft);cursor:pointer;flex:none;}
  .photo-add svg{width:20px;height:20px;}
  .action-chip{background:var(--amber-bg);color:var(--amber);font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;margin-top:8px;display:flex;align-items:center;gap:6px;}

  .quickform{background:#FBF8F0;border:1px dashed var(--amber);border-radius:10px;padding:10px;margin-top:9px;}
  .quickform .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .quickform label{margin-bottom:4px;}

  .score-hero{display:flex;align-items:center;gap:16px;background:var(--paper-raised);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;}
  .score-hero .ring{width:74px;height:74px;}
  .score-hero .num{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
  .score-hero .lbl{font-size:12px;color:var(--graphite-soft);}

  .action-item{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-bottom:1px solid var(--line);}
  .action-item:last-child{border-bottom:none;}
  .cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cb.done{background:var(--moss);border-color:var(--moss);color:#fff;}
  .action-item .body{flex:1;min-width:0;}
  .action-item .title{font-size:14px;font-weight:600;}
  .action-item.done .title{text-decoration:line-through;color:var(--graphite-soft);}
  .action-item .meta{font-size:11.5px;color:var(--graphite-soft);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
  .prio{font-weight:700;padding:1px 7px;border-radius:20px;font-size:10.5px;}
  .prio-Alta{background:var(--clay-bg);color:var(--clay);}
  .prio-Média{background:var(--amber-bg);color:var(--amber);}
  .prio-Baixa{background:#EAF0EA;color:var(--graphite-soft);}

  .sticky-save{position:sticky;bottom:0;background:var(--paper-raised);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:10;}

  .modal-bg{position:fixed;inset:0;background:rgba(20,22,17,0.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:var(--paper-raised);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto;}
  .modal h3{font-family:'Space Grotesk',sans-serif;margin:0 0 4px;}
  .modal .close{float:right;}

  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--graphite);color:#fff;padding:10px 16px;border-radius:24px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);}

  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-bottom:1px solid var(--line);}
  .settings-row:last-child{border-bottom:none;}
  .unit-tag{display:flex;align-items:center;gap:6px;background:var(--moss-bg);color:var(--forest-dark);padding:6px 10px;border-radius:20px;font-size:13px;font-weight:600;}
  .unit-tag .x{cursor:pointer;opacity:.7;}

  .loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;color:var(--graphite-soft);gap:10px;font-size:13.5px;}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--forest);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media print{
    .topbar,.fab,.tabs,.sticky-save,.icon-btn,.item-actions-row .btn,.photo-add{display:none !important;}
    body{background:#fff;}
    #app{max-width:100%;}
    .card,.section{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
  }
</style>
</head>
<body>
<div id="app"><div class="loading-wrap"><div class="spinner"></div><div>Carregando vistorias…</div></div></div>

<script>
(function(){
"use strict";

/* ============================= DATA MODEL ============================= */

const DEFAULT_TEMPLATE = [
  { id:'org', title:'Organização e Armazenamento', items:[
    { id:'q1', text:"A organização da unidade está em conformidade? (limpeza, armazenamento, organização)", positive:'Sim' },
    { id:'q2', text:"Os resíduos estão acondicionados corretamente, com todos os subgrupos conforme as obrigações técnicas?", positive:'Sim' }
  ]},
  { id:'infra', title:'Infraestrutura e Procedimentos', items:[
    { id:'q3', text:"A unidade está precisando de alguma alteração em infraestrutura civil para cumprimento de exigências ou adequação?", positive:'Não' },
    { id:'q4', text:"Os procedimentos de recebimento, armazenamento, tratamento e destinação final estão dentro dos padrões adequados?", positive:'Sim' },
    { id:'q5', text:"Foi identificado algum procedimento já definido que não está sendo cumprido?", positive:'Não' }
  ]},
  { id:'trat', title:'Tratamento (Autoclave / Trituração)', items:[
    { id:'q6', text:"Os ciclos de tratamento e o controle dos recebimentos de resíduos estão funcionando normalmente e sendo registrados?", positive:'Sim', appliesTo:'tratamento' }
  ]},
  { id:'seg', title:'Segurança do Trabalho', items:[
    { id:'q7', text:"Os funcionários presentes estavam utilizando EPIs adequadamente?", positive:'Sim' }
  ]},
  { id:'efl', title:'Efluentes e Infraestrutura Sanitária', items:[
    { id:'q8', text:"As caixas de efluentes, caixa SAO, limpeza de caixa d'água, dedetização e limpeza do ar condicionado estão em conformidade?", positive:'Sim' },
    { id:'q9', text:"A temperatura de saída da caixa de efluentes está abaixo de 40°C?", positive:'Sim', appliesTo:'tratamento' }
  ]},
  { id:'gestao', title:'Gestão da Base', items:[
    { id:'q10', text:"Existe alguma solicitação feita pelo Responsável da Base? (compra/troca de equipamentos, insumos etc.)", positive:'Não' },
    { id:'q11', text:"O Responsável pela base estava presente na visita?", positive:'Sim' }
  ]}
];

const DEFAULT_UNITS = [
  { name:'Bauru', type:'tratamento' },
  { name:'Assis', type:'tratamento' },
  { name:'São Manuel', type:'tratamento' },
  { name:'Arealva', type:'tratamento' },
  { name:'Bernardino de Campos', type:'transbordo' },
  { name:'Anhumas', type:'transbordo' },
  { name:'Itapeva', type:'transbordo' }
];
const UNIT_TYPE_LABEL = { tratamento:'Tratamento', transbordo:'Transbordo' };

function getUnitType(name){
  const u = S.settings.units.find(x => x.name === name);
  return u ? u.type : 'tratamento';
}

function buildSectionsForUnit(unitType){
  return DEFAULT_TEMPLATE
    .map(sec => ({
      ...sec,
      items: sec.items
        .filter(it => (it.appliesTo || 'all') === 'all' || it.appliesTo === unitType)
        .map(it => ({...it, answer:null, obs:'', photos:[]}))
    }))
    .filter(sec => sec.items.length > 0);
}

function hasAnyAnswer(insp){
  return insp.sections.some(s => s.items.some(it => it.answer != null));
}

const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowLocalISO = () => {
  const d = new Date(); const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const fmtDate = (iso) => { if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return iso;
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); };
const fmtDateOnly = (iso) => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('pt-BR'); };
const addDays = (iso, n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };

function emptyInspection(unit, responsavel, unitType){
  return {
    id: uid('insp'),
    unit: unit || '',
    unitType: unitType || 'tratamento',
    date: nowLocalISO(),
    responsavelVistoria: responsavel || '',
    responsavelBaseNome: '',
    sections: buildSectionsForUnit(unitType || 'tratamento'),
    analiseCritica: '',
    fotosGerais: [],
    acoes: [],
    previousInspectionId: null,
    carriedActions: [],
    acompanhanteNome: '',
    acompanhanteCargo: '',
    acompanhanteAssinatura: null,
    assinaturaVistoriador: null,
    destinatarios: (S.settings && S.settings.emailDestinatarios) || '',
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
}

function computeScore(insp){
  let total=0, conforme=0, flagged=0;
  insp.sections.forEach(s => s.items.forEach(it => {
    if(it.answer && it.answer !== 'N/A'){
      total++;
      if(it.answer === it.positive) conforme++; else flagged++;
    }
  }));
  return { total, conforme, flagged, pct: total ? Math.round((conforme/total)*100) : 0 };
}

/* ============================= STORAGE LAYER ============================= */
/* Two possible backends:
   - 'cloud'  -> window.storage, available when this file is opened as a Claude artifact
   - 'local'  -> IndexedDB in this browser, used when opened as a standalone/downloaded file
   Detected once at startup; safeGet/safeSet/safeDelete route to whichever is active. */

let STORAGE_BACKEND = null;
let IDB = null;

function idbOpen(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open('cheiroverde_vistorias', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('kv', { keyPath:'key' }); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(key){
  return new Promise((resolve,reject)=>{
    const tx = IDB.transaction('kv','readonly');
    const rq = tx.objectStore('kv').get(key);
    rq.onsuccess = () => resolve(rq.result ? rq.result.value : null);
    rq.onerror = () => reject(rq.error);
  });
}
function idbSet(key,value){
  return new Promise((resolve,reject)=>{
    const tx = IDB.transaction('kv','readwrite');
    tx.objectStore('kv').put({key,value});
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
function idbDelete(key){
  return new Promise((resolve,reject)=>{
    const tx = IDB.transaction('kv','readwrite');
    tx.objectStore('kv').delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

async function detectStorageBackend(){
  // Try the Claude artifact storage first, but verify it actually works (not just defined).
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
    try{
      const ok = await window.storage.set('__probe__', '1');
      if(ok){ STORAGE_BACKEND = 'cloud'; try{ await window.storage.delete('__probe__'); }catch(e){} return; }
    }catch(e){ /* fall through to local */ }
  }
  try{ IDB = await idbOpen(); STORAGE_BACKEND = 'local'; }
  catch(e){ STORAGE_BACKEND = 'none'; }
}

async function safeGet(key, shared){
  try{
    if(STORAGE_BACKEND==='cloud'){ const r = await window.storage.get(key, !!shared); return r ? r.value : null; }
    if(STORAGE_BACKEND==='local'){ return await idbGet(key); }
    return null;
  }catch(e){ return null; }
}
async function safeSet(key, value, shared){
  try{
    if(STORAGE_BACKEND==='cloud'){ const r = await window.storage.set(key, value, !!shared); return !!r; }
    if(STORAGE_BACKEND==='local'){ return await idbSet(key, value); }
    return false;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}
async function safeDelete(key, shared){
  try{
    if(STORAGE_BACKEND==='cloud'){ await window.storage.delete(key, !!shared); }
    else if(STORAGE_BACKEND==='local'){ await idbDelete(key); }
  }catch(e){}
}

const KEY_SETTINGS = 'settings';
const KEY_INDEX = 'inspections_index';
const KEY_ACTIONS_INDEX = 'actions_index';
const keyInsp = (id) => 'inspection:' + id;

async function loadSettings(){
  const raw = await safeGet(KEY_SETTINGS);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      // migrate older format where units was a plain array of strings
      parsed.units = (parsed.units || []).map(u => typeof u === 'string' ? { name:u, type:'tratamento' } : u);
      if(parsed.units.length === 0) parsed.units = DEFAULT_UNITS.slice();
      return withSettingsDefaults(parsed);
    }catch(e){}
  }
  return withSettingsDefaults({ units: DEFAULT_UNITS.slice(), defaultResponsavel:'' });
}
function withSettingsDefaults(s){
  if(s.vistoriadorNome == null) s.vistoriadorNome = 'Fernando J de Almeida Moreira';
  if(s.vistoriadorCargo == null) s.vistoriadorCargo = 'Responsável Técnico';
  if(s.vistoriadorAssinatura === undefined) s.vistoriadorAssinatura = null;
  if(s.emailDestinatarios == null) s.emailDestinatarios = '';
  if(!s.defaultResponsavel) s.defaultResponsavel = s.vistoriadorNome;
  return s;
}

async function loadIndex(){
  const raw = await safeGet(KEY_INDEX);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return [];
}

async function loadActionsIndex(){
  const raw = await safeGet(KEY_ACTIONS_INDEX);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return [];
}
async function saveActionsIndex(a){ await safeSet(KEY_ACTIONS_INDEX, JSON.stringify(a)); }

async function loadInspection(id){
  const raw = await safeGet(keyInsp(id));
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return null;
}

async function persistInspection(insp, {silent}={}){
  insp.updatedAt = new Date().toISOString();
  const ok = await safeSet(keyInsp(insp.id), JSON.stringify(insp));
  // update summary index
  let idx = await loadIndex();
  const score = computeScore(insp);
  const summary = { id: insp.id, unit: insp.unit, unitType: insp.unitType || getUnitType(insp.unit), date: insp.date, responsavel: insp.responsavelVistoria,
    pct: score.pct, flagged: score.flagged, total: score.total, updatedAt: insp.updatedAt };
  const pos = idx.findIndex(x => x.id === insp.id);
  if(pos>=0) idx[pos] = summary; else idx.unshift(summary);
  await saveIndex(idx);
  // sync open actions index
  let ai = await loadActionsIndex();
  ai = ai.filter(a => a.inspectionId !== insp.id);
  insp.acoes.forEach(a => ai.push({
    actionId:a.id, inspectionId:insp.id, unit:insp.unit, inspDate:insp.date,
    title:a.title, responsavel:a.responsavel, prioridade:a.prioridade, prazo:a.prazo,
    status:a.status, criadoEm:a.criadoEm
  }));
  await saveActionsIndex(ai);
  if(ok){ if(!silent) toast('Vistoria salva'); }
  else { toast('⚠️ Não foi possível salvar. Veja o aviso em Configurações.'); }
  return ok;
}

async function deleteInspection(id){
  await safeDelete(keyInsp(id));
  let idx = await loadIndex(); idx = idx.filter(x => x.id !== id); await saveIndex(idx);
  let ai = await loadActionsIndex(); ai = ai.filter(a => a.inspectionId !== id); await saveActionsIndex(ai);
}

/* ============================= IMAGE HANDLING ============================= */

function fileToCompressedDataURL(file, maxDim=1100, quality=0.62){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read fail'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('img fail'));
      img.onload = () => {
        let {width,height} = img;
        if(width > maxDim || height > maxDim){
          if(width>height){ height = Math.round(height*maxDim/width); width = maxDim; }
          else{ width = Math.round(width*maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function estimateSizeMB(insp){
  let chars = 0;
  insp.fotosGerais.forEach(p => chars += p.length);
  insp.sections.forEach(s => s.items.forEach(it => it.photos.forEach(p => chars += p.length)));
  return (chars * 0.75 / (1024*1024)).toFixed(2);
}

function hexRGB(hex){ const n = parseInt(hex.replace('#',''),16); return [(n>>16)&255,(n>>8)&255,n&255]; }

function generatePDFBlob(insp){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 42;
  let y = M;

  function ensureSpace(h){ if(y + h > H - M){ doc.addPage(); y = M; } }
  function write(str, size, opts={}){
    doc.setFontSize(size);
    doc.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    doc.setTextColor(...hexRGB(opts.color || '#23281f'));
    const lines = doc.splitTextToSize(String(str), W - 2*M - (opts.indent||0));
    lines.forEach(line=>{
      ensureSpace(size*1.5);
      doc.text(line, M + (opts.indent||0), y);
      y += size*1.4;
    });
  }
  function addPhoto(dataURL){
    ensureSpace(126);
    try{ doc.addImage(dataURL,'JPEG', M, y, 170, 118); y += 128; }catch(e){}
  }

  doc.setFillColor(...hexRGB('#1E5B3A'));
  doc.rect(0,0,W,58,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(15);
  doc.text('Cheiro Verde Ambiental', M, 28);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text('Relatório de Vistoria — Controle de Qualidade', M, 44);
  y = 80;

  const score = computeScore(insp);
  write(insp.unit || 'Unidade não definida', 17, {bold:true});
  if(insp.previousInspectionId) write('Vistoria de acompanhamento', 10, {bold:true, color:'#C98A2C'});
  write(`Data da vistoria: ${fmtDate(insp.date)}`, 10);
  write(`Responsável pela vistoria: ${insp.responsavelVistoria || '—'}`, 10);
  write(`Responsável da base presente: ${insp.responsavelBaseNome || '—'}`, 10);
  write(`Resultado: ${score.conforme}/${score.total} itens conformes (${score.pct}%) · ${score.flagged} sinalizado(s)`, 11, {bold:true});
  y += 6;

  if(insp.carriedActions && insp.carriedActions.length){
    write('AÇÕES VERIFICADAS NESTA VISTORIA', 11.5, {bold:true, color:'#1E5B3A'});
    insp.carriedActions.forEach(a=>{
      const label = !a.reviewed ? 'Não verificado' : (a.status==='Concluído' ? 'Corrigido' : 'Ainda pendente');
      write(`• ${a.title} — ${label}`, 9.5, {indent:8});
    });
    y += 6;
  }

  insp.sections.forEach(sec=>{
    ensureSpace(20);
    write(sec.title.toUpperCase(), 11.5, {bold:true, color:'#1E5B3A'});
    sec.items.forEach(it=>{
      const flagged = it.answer && it.answer!=='N/A' && it.answer!==it.positive;
      write(it.text, 9.8, {indent:6});
      write(`Resposta: ${it.answer || 'Não respondido'}`, 9.5, {indent:14, bold:true, color: it.answer==null?'#5B6055':(flagged?'#B23A2E':'#4C7A4E')});
      if(it.obs) write(`Obs: ${it.obs}`, 9, {indent:14, color:'#5B6055'});
      it.photos.forEach(p=>addPhoto(p));
      y += 3;
    });
    y += 5;
  });

  if(insp.analiseCritica){
    ensureSpace(20);
    write('ANÁLISE CRÍTICA E CONCLUSÃO', 11.5, {bold:true, color:'#1E5B3A'});
    write(insp.analiseCritica, 9.8);
    y += 4;
  }

  if(insp.fotosGerais.length){
    ensureSpace(20);
    write('RELATÓRIO FOTOGRÁFICO', 11.5, {bold:true, color:'#1E5B3A'});
    insp.fotosGerais.forEach(p=>addPhoto(p));
    y += 4;
  }

  if(insp.acoes.length){
    ensureSpace(20);
    write('AÇÕES E PRAZOS', 11.5, {bold:true, color:'#1E5B3A'});
    insp.acoes.forEach(a=>{
      write(`[${a.status}] ${a.title} — prioridade ${a.prioridade} — prazo ${fmtDateOnly(a.prazo)} — ${a.responsavel||'—'}`, 9.3, {indent:6});
    });
  }

  const hist = S.index.filter(i=>i.unit===insp.unit).sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(hist.length>1){
    ensureSpace(20);
    write('HISTÓRICO DA UNIDADE', 11.5, {bold:true, color:'#1E5B3A'});
    hist.forEach(i=> write(`${fmtDate(i.date)} — ${i.pct}% conforme`, 9.3, {indent:6}));
  }

  // Signatures, side by side
  y += 14;
  ensureSpace(150);
  write('ASSINATURAS', 11.5, {bold:true, color:'#1E5B3A'});
  y += 6;
  const colW = (W - 2*M - 30) / 2;
  const sigs = [
    { label:'Vistoriador', img:insp.assinaturaVistoriador, name:S.settings.vistoriadorNome, role:S.settings.vistoriadorCargo },
    { label:'Acompanhante', img:insp.acompanhanteAssinatura, name:insp.acompanhanteNome||'—', role:insp.acompanhanteCargo||'' }
  ];
  const top = y;
  sigs.forEach((sg,i)=>{
    const x = M + i*(colW+30);
    if(sg.img){ try{ doc.addImage(sg.img,'JPEG', x+colW*0.1, top, colW*0.8, 62); }catch(e){} }
    doc.setDrawColor(40,40,35); doc.setLineWidth(0.7);
    doc.line(x, top+70, x+colW, top+70);
    doc.setTextColor(35,40,31);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.8);
    doc.text(sg.name, x+colW/2, top+84, {align:'center', maxWidth:colW});
    doc.setFont('helvetica','normal'); doc.setFontSize(8.8);
    doc.text(`${sg.label}${sg.role?' — '+sg.role:''}`, x+colW/2, top+97, {align:'center', maxWidth:colW});
  });
  y = top + 110;

  return doc.output('blob');
}

function pdfFilename(insp){
  const safeUnit = (insp.unit||'unidade').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_');
  return `vistoria_${safeUnit}_${(insp.date||'').slice(0,10)}.pdf`;
}

function parseEmails(str){
  return (str||'').split(/[,;\s]+/).map(e=>e.trim()).filter(e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e));
}

function emailSubject(insp){
  return `Relatório de Vistoria — ${insp.unit} — ${fmtDate(insp.date)}`;
}
function emailBody(insp){
  const sc = computeScore(insp);
  const open = insp.acoes.filter(a=>a.status!=='Concluído').length;
  return `Prezados,\n\nSegue em anexo o relatório da vistoria realizada na unidade ${insp.unit} em ${fmtDate(insp.date)}.\n\n` +
    `Resultado: ${sc.conforme}/${sc.total} itens conformes (${sc.pct}%), ${sc.flagged} item(ns) sinalizado(s) e ${open} ação(ões) em aberto.\n\n` +
    `Atenciosamente,\n${S.settings.vistoriadorNome}\n${S.settings.vistoriadorCargo}\nCheiro Verde Ambiental`;
}

function openSendModal(insp){

  openModal(`

    <p style="color:var(--graphite-soft);font-size:13.5px;margin:4px 0 12px;">Deseja enviar o relatório em PDF por e-mail agora?</p>

      <b>Destinatários:</b> ${emails.length ? escapeHTML(emails.join(', ')) : '<span style="color:var(--graphite-soft)">nenhum informado</span>'}
    </div>

    <button class="btn btn-ghost btn-block" id="send-later" style="margin-top:8px;">Agora não</button>
  `);
  document.getElementById('send-mail').addEventListener('click', ()=>{ closeModal(); sendByEmail(insp); });
  document.getElementById('send-later').addEventListener('click', closeModal);

function sendByEmail(insp){
  if(!(window.jspdf && window.jspdf.jsPDF)){ toast('⚠️ Gerador de PDF indisponível — verifique a conexão.'); return; }
  let blob;
  try{ blob = generatePDFBlob(insp); }catch(e){ console.error(e); toast('Não foi possível gerar o PDF.'); return; }
  const filename = pdfFilename(insp);
  const emails = parseEmails(insp.destinatarios);
  const subject = emailSubject(insp), body = emailBody(insp);

  // Copy recipients so they can be pasted into the "To" field of Mail
  if(emails.length && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(emails.join(', ')).catch(()=>{});
  }

  // Preferred: share sheet with the PDF attached -> user picks Mail/Gmail/Outlook
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({ files:[file], title:subject, text:body })
        .then(()=>{})
        .catch(e=>{ if(!(e && e.name==='AbortError')) mailtoFallback(blob, filename, emails, subject, body); });
      if(emails.length) toast('E-mails copiados — no Mail, cole no campo "Para"');
      return;
    }
  }catch(e){}

  mailtoFallback(blob, filename, emails, subject, body);
}

function mailtoFallback(blob, filename, emails, subject, body){
  // Browsers can't attach files via mailto: download the PDF, then open a pre-filled e-mail
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
  }catch(e){}
  const href = `mailto:${encodeURIComponent(emails.join(','))}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body + '\n\n(Anexe o PDF baixado: ' + filename + ')')}`;
  setTimeout(()=>{ window.location.href = href; }, 600);
  toast('PDF baixado — anexe-o no e-mail que vai abrir');
}

async function exportPDF(insp){
  if(!(window.jspdf && window.jspdf.jsPDF)){
    toast('⚠️ Gerador de PDF indisponível — verifique a conexão e tente novamente.');
    return;
  }
  toast('Gerando PDF…');
  let blob;
  try{ blob = generatePDFBlob(insp); }
  catch(e){ console.error(e); toast('Não foi possível gerar o PDF.'); return; }

  const safeUnit = (insp.unit||'unidade').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_');
  const filename = `vistoria_${safeUnit}_${(insp.date||'').slice(0,10)}.pdf`;

  // 1) Native share sheet (works in Safari/Chrome on the published link)
  try{
    const file = new File([blob], filename, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title: filename, text: `Relatório de vistoria — ${insp.unit}` });
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return; // user cancelled the share sheet — not an error
  }

  // 2) Direct download (works in normal browsers; blocked in sandboxed viewers)
  let downloadTried = false;
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
    downloadTried = true;
  }catch(e){}

  // 3) In-app viewer fallback: always show the PDF so the user can act on it
  //    even where downloads/share are blocked (e.g. inside the Claude app).
  openPDFViewer(blob, filename, downloadTried);
}

async function exportBackup(){
  toast('Preparando backup…');
  const inspections = [];
  for(const s of S.index){
    const full = await loadInspection(s.id);
    if(full) inspections.push(full);
  }
  const payload = {
    app:'cheiroverde-vistorias', version:1,
    exportedAt:new Date().toISOString(),
    settings:S.settings,
    inspections
  };
  const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
  const d = new Date(); const pad=n=>String(n).padStart(2,'0');
  const filename = `backup_vistorias_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;

  try{
    const file = new File([blob], filename, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title: filename });
      return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }

  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
    toast(`Backup gerado: ${inspections.length} vistoria(s)`);
  }catch(e){ toast('Não foi possível salvar o backup neste ambiente.'); }
}

async function importBackup(file){
  let data;
  try{ data = JSON.parse(await file.text()); }
  catch(e){ toast('Arquivo inválido.'); return; }
  if(!data || data.app!=='cheiroverde-vistorias' || !Array.isArray(data.inspections)){
    toast('Este arquivo não é um backup do app de vistorias.'); return;
  }
  toast('Importando…');

  // merge units (keep existing, add new ones from backup)
  if(data.settings && Array.isArray(data.settings.units)){
    data.settings.units.forEach(u=>{
      const unit = typeof u==='string' ? {name:u,type:'tratamento'} : u;
      if(!S.settings.units.some(x=>x.name===unit.name)) S.settings.units.push(unit);
    });
    if(!S.settings.defaultResponsavel && data.settings.defaultResponsavel){
      S.settings.defaultResponsavel = data.settings.defaultResponsavel;
    }
    if(!S.settings.vistoriadorAssinatura && data.settings.vistoriadorAssinatura){
      S.settings.vistoriadorAssinatura = data.settings.vistoriadorAssinatura;
    }
    if(!S.settings.emailDestinatarios && data.settings.emailDestinatarios){
      S.settings.emailDestinatarios = data.settings.emailDestinatarios;
    }
    await saveSettings(S.settings);
  }

  let added=0, updated=0, failed=0;
  for(const insp of data.inspections){
    if(!insp || !insp.id) continue;
    const existing = S.index.find(i=>i.id===insp.id);
    if(existing && new Date(existing.updatedAt) >= new Date(insp.updatedAt)) continue; // local copy is newer or equal
    const keepUpdated = insp.updatedAt;
    const ok = await persistInspection(insp, {silent:true});
    if(ok){
      // preserve original timestamp so repeated imports stay idempotent
      insp.updatedAt = keepUpdated || insp.updatedAt;
      await safeSet(keyInsp(insp.id), JSON.stringify(insp));
      existing ? updated++ : added++;
    } else failed++;
    S.index = await loadIndex();
  }
  S.index = await loadIndex();
  S.actionsIndex = await loadActionsIndex();
  toast(failed ? `⚠️ ${added} importada(s), ${failed} com erro` : `✅ ${added} nova(s), ${updated} atualizada(s)`);
}

function openPDFViewer(blob, filename, downloadTried){
  const url = URL.createObjectURL(blob);
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.id='pdf-viewer-bg';
  bg.style.alignItems='stretch';
  bg.innerHTML = `
    <div class="modal" style="border-radius:0;max-height:100vh;height:100%;display:flex;flex-direction:column;padding:12px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <b style="font-family:'Space Grotesk',sans-serif;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHTML(filename)}</b>
        <button class="btn btn-ghost btn-sm" id="pdf-close">Fechar</button>
      </div>
      <iframe src="${url}" style="flex:1;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;"></iframe>
      <p style="font-size:12px;color:var(--graphite-soft);margin:10px 0 0;">
        ${downloadTried
          ? 'Se o download não apareceu, este ambiente bloqueia salvar arquivos. Abra o app pelo <b>link publicado no Safari ou Chrome</b> para compartilhar o PDF pelo WhatsApp/e-mail.'
          : 'Este ambiente bloqueia salvar arquivos. Abra o app pelo <b>link publicado no Safari ou Chrome</b> para compartilhar o PDF pelo WhatsApp/e-mail.'}
      </p>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('pdf-close').addEventListener('click', ()=>{
    bg.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  });
}

function ringSVG(pct, size=52, stroke=6){
  const r = (size-stroke)/2, c = 2*Math.PI*r;
  const color = pct>=80?'var(--moss)':pct>=50?'var(--amber)':'var(--clay)';
  const off = c - (pct/100)*c;
  return `<svg class="ring" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="53%" text-anchor="middle" dominant-baseline="middle" font-family="Space Grotesk" font-weight="700"
      font-size="${size*0.30}" fill="var(--graphite)">${pct}%</text>
  </svg>`;
}

/* ============================= RENDER: SHELL ============================= */

function render(){
  const app = document.getElementById('app');
  let title = 'Vistorias';
  if(S.view==='form') title = S.editing ? 'Vistoria' : 'Nova vistoria';
  if(S.view==='detail') title = 'Relatório';
  if(S.view==='settings') title = 'Configurações';

  app.innerHTML = `
    <div class="topbar">
      ${S.view!=='home' ? `<button class="icon-btn" id="btn-back">${ICON.back}</button>` : `<div class="brand-mark">${ICON.leaf}</div>`}
      <div class="brand-text" style="flex:1">
        <b>${title}</b>
        ${S.view==='home' ? '<span>Cheiro Verde Ambiental</span>' : ''}
      </div>
      ${S.view==='home' ? `<button class="icon-btn" id="btn-settings">${ICON.settings}</button>` : ''}
      ${S.view==='detail' ? `<button class="icon-btn" id="btn-print">${ICON.share}</button>` : ''}
    </div>
    <div class="content" id="content"></div>
  `;
  const back = document.getElementById('btn-back');
  if(back) back.addEventListener('click', onBack);
  const settingsBtn = document.getElementById('btn-settings');
  if(settingsBtn) settingsBtn.addEventListener('click', ()=>navigate('settings'));
  const printBtn = document.getElementById('btn-print');
  if(printBtn) printBtn.addEventListener('click', ()=>exportPDF(S.current));

  const c = document.getElementById('content');
  if(S.view==='home') renderHome(c);
  else if(S.view==='form') renderForm(c);
  else if(S.view==='detail') renderDetail(c);
  else if(S.view==='settings') renderSettings(c);
}

function onBack(){
  if(S.view==='form'){
    navigate('home');
  } else if(S.view==='detail'){
    navigate('home');
  } else {
    navigate('home');
  }
}

    } else {

async function toggleAction(inspId, actionId){
  const insp = await loadInspection(inspId);
  if(!insp) return;
  const a = insp.acoes.find(x=>x.id===actionId);
  if(!a) return;
  a.status = a.status==='Concluído' ? 'Aberto' : 'Concluído';
  await persistInspection(insp, {silent:true});
  S.actionsIndex = await loadActionsIndex();
  render();
}

function findLastInspectionForUnit(unitName){
  const list = S.index.filter(i=>i.unit===unitName).sort((a,b)=> new Date(b.date)-new Date(a.date));
  return list[0] || null;
}

function openNewInspectionModal(){
  if(S.settings.units.length===0){
    navigate('settings');
    toast('Cadastre ao menos uma unidade primeiro');
    return;
  }
  const optHTML = `
    <optgroup label="Tratamento">
      ${S.settings.units.filter(u=>u.type==='tratamento').map(u=>`<option value="${escapeAttr(u.name)}">${escapeHTML(u.name)}</option>`).join('')}
    </optgroup>
    <optgroup label="Transbordo">
      ${S.settings.units.filter(u=>u.type==='transbordo').map(u=>`<option value="${escapeAttr(u.name)}">${escapeHTML(u.name)}</option>`).join('')}
    </optgroup>`;
  openModal(`
    <h3>Nova vistoria</h3>
    <p style="color:var(--graphite-soft);font-size:13.5px;margin:4px 0 12px;">Qual unidade você vai vistoriar?</p>
    <select id="ni-unit" style="width:100%;">${optHTML}</select>
    <div id="ni-prev-info" style="margin-top:12px;"></div>
    <button class="btn btn-primary btn-block" id="ni-continue" style="margin-top:14px;">Continuar</button>
  `);
  const unitSel = document.getElementById('ni-unit');
  const infoBox = document.getElementById('ni-prev-info');
  function refreshInfo(){
    const prev = findLastInspectionForUnit(unitSel.value);
    const openCount = S.actionsIndex.filter(a=>a.unit===unitSel.value && a.status!=='Concluído').length;
    if(prev){
      infoBox.innerHTML = `
        <div style="background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;">
          <div style="font-size:12px;color:var(--graphite-soft);">Última vistoria nesta unidade</div>
          <div style="font-weight:700;font-size:14px;margin-top:2px;">${fmtDate(prev.date)} · ${prev.pct}% conforme</div>
          <div style="font-size:12px;color:var(--graphite-soft);margin-top:2px;">${prev.flagged} sinalizado(s) · ${openCount} ação(ões) em aberto</div>
        </div>`;
    } else {
      infoBox.innerHTML = `<div style="font-size:12px;color:var(--graphite-soft);">Nenhuma vistoria anterior nesta unidade — será uma vistoria nova.</div>`;
    }
  }
  unitSel.addEventListener('change', refreshInfo);
  refreshInfo();
  document.getElementById('ni-continue').addEventListener('click', ()=>{
    const unitName = unitSel.value;
    const unitType = getUnitType(unitName);
    const prev = findLastInspectionForUnit(unitName);
    closeModal();
    if(prev) openFollowUpChoiceModal(unitName, unitType, prev);
    else {
      const insp = emptyInspection(unitName, S.settings.defaultResponsavel, unitType);
      navigate('form', {current:insp, editing:false});
    }
  });
}

function openFollowUpChoiceModal(unitName, unitType, prevSummary){
  openModal(`
    <h3>${escapeHTML(unitName)}</h3>
    <p style="color:var(--graphite-soft);font-size:13.5px;">Última vistoria em ${fmtDate(prevSummary.date)} · ${prevSummary.pct}% conforme.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px;">
      <button class="btn btn-primary btn-block" id="ni-followup">Vistoria de acompanhamento</button>
      <button class="btn btn-ghost btn-block" id="ni-fresh">Vistoria nova (do zero)</button>
    </div>
    <p style="font-size:11.5px;color:var(--graphite-soft);margin-top:10px;">A vistoria de acompanhamento mostra o que foi sinalizado na visita anterior item a item e traz as ações em aberto para você confirmar se foram corrigidas.</p>
  `);
  document.getElementById('ni-followup').addEventListener('click', async ()=>{
    closeModal();
    const prevFull = await loadInspection(prevSummary.id);
    const insp = buildFollowUpInspection(unitName, unitType, prevFull);
    navigate('form', {current:insp, editing:false});
  });
  document.getElementById('ni-fresh').addEventListener('click', ()=>{
    closeModal();
    const insp = emptyInspection(unitName, S.settings.defaultResponsavel, unitType);
    navigate('form', {current:insp, editing:false});
  });
}

function buildFollowUpInspection(unitName, unitType, prevFull){
  const insp = emptyInspection(unitName, S.settings.defaultResponsavel, unitType);
  insp.previousInspectionId = prevFull ? prevFull.id : null;
  if(prevFull){
    insp.sections.forEach(sec=>{
      const prevSec = prevFull.sections.find(s=>s.id===sec.id);
      if(!prevSec) return;
      sec.items.forEach(it=>{
        const prevIt = prevSec.items.find(x=>x.id===it.id);
        if(prevIt && prevIt.answer){
          it.previousAnswer = prevIt.answer;
          it.previousObs = prevIt.obs || '';
          it.previousDate = prevFull.date;
        }
      });
    });
  }
  insp.carriedActions = S.actionsIndex
    .filter(a=>a.unit===unitName && a.status!=='Concluído')
    .map(a=>({...a, reviewed:false}));
  return insp;
}

async function reviewCarriedAction(insp, action, newStatus, c){
  action.status = newStatus;
  action.reviewed = true;
  action.reviewedAt = new Date().toISOString();
  const orig = await loadInspection(action.inspectionId);
  if(orig){
    const origAction = orig.acoes.find(x=>x.id===action.actionId);
    if(origAction){
      origAction.status = newStatus;
      origAction.checkIns = origAction.checkIns || [];
      origAction.checkIns.push({ date:new Date().toISOString(), status:newStatus, verifiedInInspectionId: insp.id, verifiedUnit: insp.unit, verifiedDate: insp.date });
      await persistInspection(orig, {silent:true});
    }
  }
  S.actionsIndex = await loadActionsIndex();
  scheduleAutosave();
  renderForm(c);
}

function unitHistoryHTML(unitName, excludeId){
  const list = S.index.filter(i=>i.unit===unitName).sort((a,b)=> new Date(a.date)-new Date(b.date));
  if(list.length<2) return '';
  let rows = '';
  list.forEach((i,idx)=>{
    const prev = list[idx-1];
    let delta = '<span style="color:var(--graphite-soft);font-size:11.5px;">—</span>';
    if(prev){
      const diff = i.pct - prev.pct;
      delta = diff>0 ? `<span style="color:var(--moss);font-weight:700;font-size:12px;">▲ +${diff}%</span>`
        : diff<0 ? `<span style="color:var(--clay);font-weight:700;font-size:12px;">▼ ${diff}%</span>`
        : `<span style="color:var(--graphite-soft);font-size:12px;">= 0%</span>`;
    }
    const isCurrent = i.id===excludeId;
    rows += `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);${isCurrent?'font-weight:700;':''}">
      <span class="mono" style="font-size:12px;">${fmtDate(i.date)}${isCurrent?' · esta vistoria':''}</span>
      <span style="font-size:13px;">${i.pct}%</span>
      ${delta}
    </div>`;
  });
  return `<div class="section"><div class="section-head"><h3>Histórico da unidade</h3></div><div class="field">${rows}</div></div>`;
}
