      const flagged = it.answer && it.answer!=='N/A' && it.answer!==it.positive;
      html += `<div class="item" data-si="${si}" data-ii="${ii}">
        <div class="item-q">${escapeHTML(it.text)}</div>
        ${it.previousAnswer?`<div class="mono" style="font-size:11px;color:${it.previousAnswer===it.positive?'var(--moss)':'var(--clay)'};margin-bottom:8px;">Última vistoria (${fmtDateOnly(it.previousDate?it.previousDate.slice(0,10):null)}): ${it.previousAnswer}${it.previousObs?' — '+escapeHTML(it.previousObs):''}</div>`:''}
        <div class="seg" data-answer-si="${si}" data-answer-ii="${ii}">
          ${['Sim','Não','N/A'].map(v=>{
            let cls='';
            if(it.answer===v){ cls = v==='N/A' ? 'on-gray' : (v===it.positive ? 'on-green' : 'on-red'); }
            return `<button type="button" class="seg-btn ${cls}" data-val="${v}">${v}</button>`;

          }).join('')}
        </div>
        ${flagged?`<div class="item-flag">${ICON.alert} Item sinalizado — não conforme</div>`:''}
        <div class="obs-input">
          <input type="text" placeholder="Observação (opcional)" data-obs-si="${si}" data-obs-ii="${ii}" value="${escapeAttr(it.obs)}">
        </div>
        <div class="thumbs" data-thumbs-si="${si}" data-thumbs-ii="${ii}">
          ${it.photos.map((p,pi)=>`<div class="thumb"><img src="${p}"><div class="rm" data-rmphoto-si="${si}" data-rmphoto-ii="${ii}" data-pi="${pi}">✕</div></div>`).join('')}
          <label class="photo-add" title="Câmera">${ICON.camera}<input type="file" accept="image/*" capture="environment" style="display:none" data-addphoto-si="${si}" data-addphoto-ii="${ii}"></label><label class="photo-add" title="Galeria">${ICON.gallery}<input type="file" accept="image/*" multiple style="display:none" data-addphoto-si="${si}" data-addphoto-ii="${ii}"></label>
        </div>
        <div class="item-actions-row">
          <button type="button" class="btn btn-sm btn-ghost" data-quickaction-si="${si}" data-quickaction-ii="${ii}">+ Ação / prazo</button>
        </div>
        <div class="qf-slot" data-qfslot-si="${si}" data-qfslot-ii="${ii}"></div>
        <div class="linked-actions" data-linked-si="${si}" data-linked-ii="${ii}">
          ${insp.acoes.filter(a=>a.origemItemId===it.id).map(a=>`<div class="action-chip">✓ ${escapeHTML(a.title)} · vence ${fmtDateOnly(a.prazo)}</div>`).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  html += `<div class="section">
    <div class="section-head"><h3>Análise crítica e conclusão</h3></div>
    <div class="field">
      <textarea id="f-analise" placeholder="Resumo da vistoria, recomendações e prazos combinados...">${escapeHTML(insp.analiseCritica)}</textarea>
    </div>
  </div>`;

  html += `<div class="section">
    <div class="section-head"><h3>Relatório fotográfico geral</h3><span class="mono" style="font-size:11px;color:var(--graphite-soft)">${estimateSizeMB(insp)} MB</span></div>
    <div class="field">
      <div class="thumbs">
        ${insp.fotosGerais.map((p,pi)=>`<div class="thumb"><img src="${p}"><div class="rm" data-rmgeral="${pi}">✕</div></div>`).join('')}
        <label class="photo-add" title="Câmera">${ICON.camera}<input type="file" accept="image/*" capture="environment" style="display:none" class="f-addgeral"></label><label class="photo-add" title="Galeria">${ICON.gallery}<input type="file" accept="image/*" multiple style="display:none" class="f-addgeral"></label>
      </div>
    </div>
  </div>`;

  const vistSig = insp.assinaturaVistoriador || S.settings.vistoriadorAssinatura;
  html += `<div class="section">
    <div class="section-head"><h3>Assinaturas</h3></div>
    <div class="field">
      ${signatureBlockHTML({label:'Vistoriador', name:S.settings.vistoriadorNome, role:S.settings.vistoriadorCargo, img:vistSig, btnId:'sig-vist', editable:true})}
      ${!vistSig?'<p style="font-size:11.5px;color:var(--graphite-soft);margin:-4px 0 10px;">Dica: salve sua assinatura em Configurações para ela entrar automaticamente em todas as vistorias.</p>':''}
      <label>Acompanhante — nome</label>
      <input type="text" id="f-acomp-nome" placeholder="Nome de quem acompanhou a vistoria" value="${escapeAttr(insp.acompanhanteNome||'')}">
      <label style="margin-top:10px;">Acompanhante — cargo</label>
      <input type="text" id="f-acomp-cargo" placeholder="Ex: Responsável da base, Encarregado" value="${escapeAttr(insp.acompanhanteCargo||'')}">
      <div style="margin-top:12px;">
        ${signatureBlockHTML({label:'Acompanhante', name:insp.acompanhanteNome||'Nome do acompanhante', role:insp.acompanhanteCargo||'', img:insp.acompanhanteAssinatura, btnId:'sig-acomp', clearId:'sig-acomp-clear', editable:true})}
      </div>
    </div>
  </div>`;

  html += `<div class="section">
    <div class="section-head"><h3>Envio do relatório</h3></div>
    <div class="field">
      <label>E-mails dos destinatários (separe por vírgula)</label>
      <input type="text" inputmode="email" id="f-dest" placeholder="ex: fulano@empresa.com, ciclano@empresa.com" value="${escapeAttr(insp.destinatarios||'')}">
    </div>
  </div>`;

  html += `<div class="score-hero">
    ${ringSVG(score.pct,74,8)}
    <div>
      <div class="num">${score.conforme}/${score.total}</div>
      <div class="lbl">itens conformes · ${score.flagged} sinalizado${score.flagged===1?'':'s'}</div>
    </div>
  </div>`;

  c.innerHTML = html;
  attachFormListeners(c);

  // sticky save bar
  document.querySelectorAll('#app > .sticky-save').forEach(el=>el.remove());
  const bar = document.createElement('div');
  bar.className='sticky-save';
  bar.innerHTML = `
    ${S.editing?`<button class="btn btn-danger" id="btn-del">${ICON.trash}</button>`:''}
    <button class="btn btn-primary btn-block" id="btn-save">Salvar vistoria</button>
  `;
  document.getElementById('app').appendChild(bar);
  document.getElementById('btn-save').addEventListener('click', async ()=>{
    if(!S.current.assinaturaVistoriador && S.settings.vistoriadorAssinatura){
      S.current.assinaturaVistoriador = S.settings.vistoriadorAssinatura;
    }
    await persistInspection(S.current);
    S.index = await loadIndex();
    S.actionsIndex = await loadActionsIndex();
    navigate('detail', {current:S.current, editing:false});
    openSendModal(S.current);
  });
  const delBtn = document.getElementById('btn-del');
  if(delBtn) delBtn.addEventListener('click', confirmDeleteCurrent);
}

function scheduleAutosave(){
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(()=>{ persistInspection(S.current, {silent:true}); }, 900);
}

function attachFormListeners(c){
  const insp = S.current;

  const sigVist = document.getElementById('sig-vist');
  if(sigVist) sigVist.addEventListener('click', ()=>{
    openSignaturePad('Assinatura do vistoriador', `${S.settings.vistoriadorNome} — ${S.settings.vistoriadorCargo}`, async (data)=>{
      insp.assinaturaVistoriador = data;
      if(!S.settings.vistoriadorAssinatura){
        S.settings.vistoriadorAssinatura = data;
        await saveSettings(S.settings);
        toast('Assinatura salva como padrão para as próximas vistorias');
      }
      scheduleAutosave(); renderForm(c);
    });
  });
  const sigAcomp = document.getElementById('sig-acomp');
  if(sigAcomp) sigAcomp.addEventListener('click', ()=>{
    const who = [insp.acompanhanteNome, insp.acompanhanteCargo].filter(Boolean).join(' — ');
    openSignaturePad('Assinatura do acompanhante', who || 'Peça ao acompanhante para assinar abaixo.', (data)=>{
      insp.acompanhanteAssinatura = data; scheduleAutosave(); renderForm(c);
    });
  });
  const sigAcompClear = document.getElementById('sig-acomp-clear');
  if(sigAcompClear) sigAcompClear.addEventListener('click', ()=>{ insp.acompanhanteAssinatura=null; scheduleAutosave(); renderForm(c); });

  const acNome = document.getElementById('f-acomp-nome');
  if(acNome){
    acNome.addEventListener('input', e=>{ insp.acompanhanteNome=e.target.value; scheduleAutosave(); });
    acNome.addEventListener('change', ()=>renderForm(c));
  }
  const acCargo = document.getElementById('f-acomp-cargo');
  if(acCargo){
    acCargo.addEventListener('input', e=>{ insp.acompanhanteCargo=e.target.value; scheduleAutosave(); });
    acCargo.addEventListener('change', ()=>renderForm(c));
  }
  const dest = document.getElementById('f-dest');
  if(dest) dest.addEventListener('input', e=>{ insp.destinatarios=e.target.value; scheduleAutosave(); });

  c.querySelectorAll('[data-carried-review]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const action = insp.carriedActions[+btn.dataset.carriedReview];
      reviewCarriedAction(insp, action, btn.dataset.carriedStatus, c);
    });
  });

  const unitEl = document.getElementById('f-unit');
  if(unitEl) unitEl.addEventListener('change', e=>{
    insp.unit = e.target.value;
    const newType = getUnitType(insp.unit);
    if(!hasAnyAnswer(insp) && newType !== insp.unitType){
      insp.unitType = newType;
      insp.sections = buildSectionsForUnit(newType);
    } else {
      insp.unitType = newType;
    }
    scheduleAutosave();
    renderForm(c);
  });
  const dateEl = document.getElementById('f-date');
  if(dateEl) dateEl.addEventListener('change', e=>{ insp.date=e.target.value; scheduleAutosave(); });
  const respEl = document.getElementById('f-resp');
  if(respEl) respEl.addEventListener('input', e=>{ insp.responsavelVistoria=e.target.value; scheduleAutosave(); });
  const respBaseEl = document.getElementById('f-respbase');
  if(respBaseEl){
    respBaseEl.addEventListener('input', e=>{
      const prev = insp.responsavelBaseNome;
      insp.responsavelBaseNome = e.target.value;
      if(!insp.acompanhanteNome || insp.acompanhanteNome === prev) insp.acompanhanteNome = e.target.value;
      scheduleAutosave();
    });
    respBaseEl.addEventListener('change', ()=>renderForm(c));
  }
  const analiseEl = document.getElementById('f-analise');
  if(analiseEl) analiseEl.addEventListener('input', e=>{ insp.analiseCritica=e.target.value; scheduleAutosave(); });

  c.querySelectorAll('[data-answer-si]').forEach(seg=>{
    seg.querySelectorAll('.seg-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const si = +seg.dataset.answerSi, ii = +seg.dataset.answerIi;
        const it = insp.sections[si].items[ii];
        it.answer = (it.answer===btn.dataset.val) ? null : btn.dataset.val;
        scheduleAutosave();
        renderForm(c);
      });
    });
  });

  c.querySelectorAll('[data-obs-si]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      insp.sections[+inp.dataset.obsSi].items[+inp.dataset.obsIi].obs = inp.value;
      scheduleAutosave();
    });
  });

  c.querySelectorAll('[data-addphoto-si]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const si=+inp.dataset.addphotoSi, ii=+inp.dataset.addphotoIi;
      for(const file of inp.files){
        try{ const d = await fileToCompressedDataURL(file); insp.sections[si].items[ii].photos.push(d); }
        catch(e){ toast('Não foi possível anexar a foto'); }
      }
      scheduleAutosave();
      renderForm(c);
    });
  });
  c.querySelectorAll('[data-rmphoto-si]').forEach(x=>{
    x.addEventListener('click', ()=>{
      insp.sections[+x.dataset.rmphotoSi].items[+x.dataset.rmphotoIi].photos.splice(+x.dataset.pi,1);
      scheduleAutosave(); renderForm(c);
    });
  });

  c.querySelectorAll('.f-addgeral').forEach(addGeral=>addGeral.addEventListener('change', async ()=>{
    for(const file of addGeral.files){
      try{ const d = await fileToCompressedDataURL(file); insp.fotosGerais.push(d); }
      catch(e){ toast('Não foi possível anexar a foto'); }
    }
    scheduleAutosave(); renderForm(c);
  }));
  c.querySelectorAll('[data-rmgeral]').forEach(x=>{
    x.addEventListener('click', ()=>{ insp.fotosGerais.splice(+x.dataset.rmgeral,1); scheduleAutosave(); renderForm(c); });
  });

  c.querySelectorAll('[data-quickaction-si]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const si=+btn.dataset.quickactionSi, ii=+btn.dataset.quickactionIi;
      const slot = c.querySelector(`[data-qfslot-si="${si}"][data-qfslot-ii="${ii}"]`);
      if(slot.innerHTML){ slot.innerHTML=''; return; }
      const it = insp.sections[si].items[ii];
      slot.innerHTML = `
        <div class="quickform">
          <label>Ação corretiva</label>
          <input type="text" data-qf-title value="${escapeAttr(it.text.slice(0,80))}">
          <div class="row2">
            <div><label>Responsável</label><input type="text" data-qf-resp value="${escapeAttr(insp.responsavelVistoria||S.settings.defaultResponsavel||'')}"></div>
            <div><label>Prioridade</label><select data-qf-prio><option>Baixa</option><option>Média</option><option>Alta</option></select></div>
          </div>
          <div class="row2">
            <div><label>Prazo</label><input type="date" data-qf-prazo value="${addDays(null,7)}"></div>
            <div style="display:flex;align-items:flex-end;"><button type="button" class="btn btn-primary btn-sm btn-block" data-qf-add>Adicionar</button></div>
          </div>
        </div>`;
      slot.querySelector('[data-qf-add]').addEventListener('click', ()=>{
        const title = slot.querySelector('[data-qf-title]').value.trim();
        if(!title){ toast('Descreva a ação'); return; }
        insp.acoes.push({
          id: uid('acao'), title,
          responsavel: slot.querySelector('[data-qf-resp]').value.trim(),
          prioridade: slot.querySelector('[data-qf-prio]').value,
          prazo: slot.querySelector('[data-qf-prazo]').value,
          status:'Aberto', origemItemId: it.id, criadoEm: new Date().toISOString()
        });
        scheduleAutosave();
        renderForm(c);
      });
    });
  });
}

async function confirmDeleteCurrent(){
  openModal(`
    <h3>Excluir vistoria?</h3>
    <p style="color:var(--graphite-soft);font-size:14px;">Esta ação não pode ser desfeita. Todas as fotos e observações desta vistoria serão removidas.</p>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="btn btn-ghost btn-block" id="m-cancel">Cancelar</button>
      <button class="btn btn-danger btn-block" id="m-confirm">Excluir</button>
    </div>
  `);
  document.getElementById('m-cancel').addEventListener('click', closeModal);
  document.getElementById('m-confirm').addEventListener('click', async ()=>{
    await deleteInspection(S.current.id);
    S.index = await loadIndex();
    S.actionsIndex = await loadActionsIndex();
    closeModal();
    navigate('home');
    toast('Vistoria excluída');
  });
}

/* ============================= RENDER: DETAIL ============================= */

function renderDetail(c){
  const insp = S.current;
  const score = computeScore(insp);
  let html = `
    <div class="score-hero">
      ${ringSVG(score.pct,74,8)}
      <div>
        <div class="num">${escapeHTML(insp.unit)}</div>
        <div class="lbl mono">${fmtDate(insp.date)}</div>
        <div class="lbl">${score.conforme}/${score.total} conformes · ${score.flagged} sinalizado${score.flagged===1?'':'s'}</div>
        ${insp.previousInspectionId?'<div class="lbl" style="color:var(--amber);font-weight:600;">Vistoria de acompanhamento</div>':''}
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h3>Identificação</h3></div>
      <div class="field"><label>Responsável pela vistoria</label><div>${escapeHTML(insp.responsavelVistoria||'—')}</div></div>
      <div class="field"><label>Responsável da base presente</label><div>${escapeHTML(insp.responsavelBaseNome||'—')}</div></div>
    </div>
  `;

  if(insp.carriedActions && insp.carriedActions.length){
    html += `<div class="section"><div class="section-head"><h3>Ações verificadas nesta vistoria</h3></div>`;
    insp.carriedActions.forEach(a=>{
      const label = !a.reviewed ? 'Não verificado' : (a.status==='Concluído' ? 'Corrigido' : 'Ainda pendente');
      const color = !a.reviewed ? 'var(--graphite-soft)' : (a.status==='Concluído' ? 'var(--moss)' : 'var(--clay)');
      html += `<div class="item">
        <div class="item-q" style="margin-bottom:5px;">${escapeHTML(a.title)}</div>
        <div style="font-weight:700;color:${color};font-size:13px;">${label}</div>
      </div>`;
    });
    html += `</div>`;
  }

  insp.sections.forEach(sec=>{
    html += `<div class="section"><div class="section-head"><h3>${escapeHTML(sec.title)}</h3></div>`;
    sec.items.forEach(it=>{
      const flagged = it.answer && it.answer!=='N/A' && it.answer!==it.positive;
      const color = it.answer==null ? 'var(--graphite-soft)' : (it.answer==='N/A' ? 'var(--graphite-soft)' : (flagged?'var(--clay)':'var(--moss)'));
      let trend = '';
      if(it.previousAnswer && it.answer && it.answer!=='N/A' && it.previousAnswer!=='N/A'){
        const wasFlagged = it.previousAnswer !== it.positive;
        if(wasFlagged && !flagged) trend = `<span style="color:var(--moss);font-weight:700;font-size:12px;margin-left:8px;">▲ melhorou</span>`;
        else if(!wasFlagged && flagged) trend = `<span style="color:var(--clay);font-weight:700;font-size:12px;margin-left:8px;">▼ piorou</span>`;
        else if(wasFlagged && flagged) trend = `<span style="color:var(--amber);font-weight:700;font-size:12px;margin-left:8px;">= ainda pendente</span>`;
      }
      html += `<div class="item">
        <div class="item-q">${escapeHTML(it.text)}</div>
        <div style="font-weight:700;color:${color};font-size:13.5px;">${it.answer || 'Não respondido'}${trend}</div>
        ${it.obs?`<div style="font-size:13px;color:var(--graphite-soft);margin-top:5px;">${escapeHTML(it.obs)}</div>`:''}
        ${it.photos.length?`<div class="thumbs">${it.photos.map(p=>`<div class="thumb"><img src="${p}"></div>`).join('')}</div>`:''}
      </div>`;
    });
    html += `</div>`;
  });

  if(insp.analiseCritica){
    html += `<div class="section"><div class="section-head"><h3>Análise crítica e conclusão</h3></div><div class="field">${escapeHTML(insp.analiseCritica).replace(/\n/g,'<br>')}</div></div>`;
  }

  if(insp.fotosGerais.length){
    html += `<div class="section"><div class="section-head"><h3>Relatório fotográfico</h3></div><div class="field"><div class="thumbs">${insp.fotosGerais.map(p=>`<div class="thumb" style="width:80px;height:80px;"><img src="${p}"></div>`).join('')}</div></div></div>`;
  }

  if(insp.acoes.length){
    html += `<div class="section"><div class="section-head"><h3>Ações e prazos</h3></div>`;
    insp.acoes.forEach(a=>{
      html += `<div class="action-item ${a.status==='Concluído'?'done':''}">
        <div class="cb ${a.status==='Concluído'?'done':''}" data-toggle-local="${a.id}">${a.status==='Concluído'?'✓':''}</div>
        <div class="body">
          <div class="title">${escapeHTML(a.title)}</div>
          <div class="meta"><span class="prio prio-${a.prioridade}">${a.prioridade}</span><span>Prazo: ${fmtDateOnly(a.prazo)}</span><span>${escapeHTML(a.responsavel||'')}</span></div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  const vistSigD = insp.assinaturaVistoriador;
  html += `<div class="section"><div class="section-head"><h3>Assinaturas</h3></div><div class="field">
    ${signatureBlockHTML({label:'Vistoriador', name:S.settings.vistoriadorNome, role:S.settings.vistoriadorCargo, img:vistSigD, editable:false})}
    ${signatureBlockHTML({label:'Acompanhante', name:insp.acompanhanteNome||'—', role:insp.acompanhanteCargo||'', img:insp.acompanhanteAssinatura, editable:false})}
  </div></div>`;

  html += unitHistoryHTML(insp.unit, insp.id);

  c.innerHTML = html;
  c.querySelectorAll('[data-toggle-local]').forEach(el=>el.addEventListener('click', async ()=>{
    const a = insp.acoes.find(x=>x.id===el.dataset.toggleLocal);
    a.status = a.status==='Concluído' ? 'Aberto' : 'Concluído';
    await persistInspection(insp, {silent:true});
    S.actionsIndex = await loadActionsIndex();
    renderDetail(c);
  }));

  document.querySelectorAll('#app > .sticky-save').forEach(el=>el.remove());
  const bar = document.createElement('div');
  bar.className='sticky-save';
  bar.innerHTML = `
    <button class="btn btn-ghost" id="btn-edit">Editar</button>
    <button class="btn btn-ghost" id="btn-share" title="Compartilhar PDF">${ICON.share} PDF</button>
    <button class="btn btn-primary btn-block" id="btn-mail">${ICON.mail} Enviar por e-mail</button>
  `;
  document.getElementById('app').appendChild(bar);
  document.getElementById('btn-edit').addEventListener('click', ()=>navigate('form', {current:insp, editing:true}));
  document.getElementById('btn-share').addEventListener('click', ()=>exportPDF(insp));
  document.getElementById('btn-mail').addEventListener('click', ()=>sendByEmail(insp));
}

/* ============================= RENDER: SETTINGS ============================= */

function unitGroupHTML(type, label){
  const list = S.settings.units.filter(u=>u.type===type);
  return `
    <div style="margin-bottom:12px;">
      <div class="mono" style="font-size:11px;color:var(--graphite-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px;">${label}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${list.map(u=>`<div class="unit-tag">${escapeHTML(u.name)}<span class="x" data-rmunit="${escapeAttr(u.name)}">✕</span></div>`).join('') || '<span style="color:var(--graphite-soft);font-size:13px;">Nenhuma</span>'}
      </div>
    </div>`;
}

function renderSettings(c){
  const backendInfo = STORAGE_BACKEND==='cloud'
    ? { color:'var(--moss)', label:'Salvando na sua conta Claude', detail:'Os dados ficam disponíveis sempre que você abrir esta vistoria dentro do Claude, em qualquer aparelho.' }
    : STORAGE_BACKEND==='local'
    ? { color:'var(--amber)', label:'Salvando apenas neste navegador', detail:'Este arquivo foi aberto fora do Claude, então os dados ficam guardados só neste celular/navegador. Não apague os dados do navegador e evite usar em aba anônima. Não sincroniza com outros aparelhos.' }
    : { color:'var(--clay)', label:'Não foi possível salvar dados', detail:'Este navegador está bloqueando o armazenamento (ex: aba anônima). Abra em uma aba normal ou dentro do Claude.' };
  let html = `
    <div class="section">
      <div class="field" style="display:flex;gap:10px;align-items:flex-start;">
        <div style="width:9px;height:9px;border-radius:50%;background:${backendInfo.color};margin-top:5px;flex:none;"></div>
        <div>
          <div style="font-weight:700;font-size:13.5px;">${backendInfo.label}</div>
          <div style="font-size:12px;color:var(--graphite-soft);margin-top:2px;">${backendInfo.detail}</div>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h3>Unidades operacionais</h3></div>
      <div class="field">
        ${unitGroupHTML('tratamento','Tratamento de resíduos')}
        ${unitGroupHTML('transbordo','Transbordo')}
        <div style="display:flex;gap:8px;margin-top:6px;">
          <input type="text" id="s-newunit" placeholder="Nome da unidade">
          <select id="s-newtype" style="width:150px;flex:none;">
            <option value="tratamento">Tratamento</option>
            <option value="transbordo">Transbordo</option>
          </select>
          <button class="btn btn-primary btn-sm" id="s-addunit">${ICON.plus}</button>
        </div>
        <p style="font-size:11.5px;color:var(--graphite-soft);margin:8px 0 0;">Unidades de transbordo recebem um checklist sem a etapa de tratamento (ciclos de autoclave e temperatura da caixa de efluentes).</p>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h3>Vistoriador e assinatura</h3></div>
      <div class="field">
        <label>Nome</label>
        <input type="text" id="s-vnome" value="${escapeAttr(S.settings.vistoriadorNome)}">
        <label style="margin-top:10px;">Cargo</label>
        <input type="text" id="s-vcargo" value="${escapeAttr(S.settings.vistoriadorCargo)}">
        <div style="margin-top:12px;">
          ${signatureBlockHTML({label:'Assinatura padrão do vistoriador', name:S.settings.vistoriadorNome, role:S.settings.vistoriadorCargo, img:S.settings.vistoriadorAssinatura, btnId:'s-sig', clearId:'s-sig-clear', editable:true})}
        </div>
        <p style="font-size:11.5px;color:var(--graphite-soft);margin:0;">Essa assinatura entra automaticamente em todas as novas vistorias. Vistorias já salvas mantêm a assinatura que tinham.</p>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h3>Destinatários padrão do relatório</h3></div>
      <div class="field">
        <label>E-mails que já vêm preenchidos em toda nova vistoria (separe por vírgula)</label>
        <input type="text" inputmode="email" id="s-emails" value="${escapeAttr(S.settings.emailDestinatarios)}" placeholder="ex: diretoria@cheiroverde.com.br">
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h3>Backup do histórico</h3></div>
      <div class="field">
        <p style="font-size:13px;color:var(--graphite-soft);margin:0 0 10px;">${S.index.length} vistoria(s) neste aparelho. Exporte um arquivo de backup para guardar com segurança ou transferir o histórico para outro aparelho/endereço.</p>
        <button class="btn btn-primary btn-block" id="s-export">Exportar backup</button>
        <label class="btn btn-ghost btn-block" style="margin-top:8px;">Importar backup
          <input type="file" accept=".json,application/json" id="s-import" style="display:none">
        </label>
        <p style="font-size:11.5px;color:var(--graphite-soft);margin:8px 0 0;">A importação soma ao que já existe — vistorias repetidas não são duplicadas.</p>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><h3>Dados</h3></div>
      <div class="field">
        <p style="font-size:13px;color:var(--graphite-soft);margin:0 0 10px;">Os dados das vistorias ficam salvos neste dispositivo/conta e não são compartilhados com outras pessoas.</p>
        <button class="btn btn-danger btn-block" id="s-wipe">Apagar todas as vistorias</button>
      </div>
    </div>
  `;
  c.innerHTML = html;

  document.getElementById('s-export').addEventListener('click', exportBackup);
  document.getElementById('s-import').addEventListener('change', async (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    await importBackup(f);
    renderSettings(c);
  });

  document.getElementById('s-addunit').addEventListener('click', async ()=>{
    const inp = document.getElementById('s-newunit');
    const typeSel = document.getElementById('s-newtype');
    const v = inp.value.trim();
    if(!v) return;
    if(!S.settings.units.some(u=>u.name===v)) S.settings.units.push({name:v, type:typeSel.value});
    await saveSettings(S.settings);
    renderSettings(c);
  });
  c.querySelectorAll('[data-rmunit]').forEach(x=>x.addEventListener('click', async ()=>{
    S.settings.units = S.settings.units.filter(u=>u.name!==x.dataset.rmunit);
    await saveSettings(S.settings);
    renderSettings(c);
  }));
  document.getElementById('s-vnome').addEventListener('change', async (e)=>{
    S.settings.vistoriadorNome = e.target.value.trim();
    S.settings.defaultResponsavel = S.settings.vistoriadorNome;
    await saveSettings(S.settings); renderSettings(c);
  });
  document.getElementById('s-vcargo').addEventListener('change', async (e)=>{
    S.settings.vistoriadorCargo = e.target.value.trim();
    await saveSettings(S.settings); renderSettings(c);
  });
  document.getElementById('s-emails').addEventListener('change', async (e)=>{
    S.settings.emailDestinatarios = parseEmails(e.target.value).join(', ');
    await saveSettings(S.settings); renderSettings(c);
    toast('Destinatários padrão salvos');
  });
  document.getElementById('s-sig').addEventListener('click', ()=>{
    openSignaturePad('Sua assinatura padrão', `${S.settings.vistoriadorNome} — ${S.settings.vistoriadorCargo}`, async (data)=>{
      S.settings.vistoriadorAssinatura = data;
      await saveSettings(S.settings); renderSettings(c);
      toast('Assinatura padrão salva');
    });
  });
  const sClear = document.getElementById('s-sig-clear');
  if(sClear) sClear.addEventListener('click', async ()=>{
    S.settings.vistoriadorAssinatura = null;
    await saveSettings(S.settings); renderSettings(c);
  });
  document.getElementById('s-wipe').addEventListener('click', ()=>{
    openModal(`
      <h3>Apagar tudo?</h3>
      <p style="color:var(--graphite-soft);font-size:14px;">Todas as vistorias, fotos e ações cadastradas serão removidas permanentemente deste app.</p>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn btn-ghost btn-block" id="m-cancel">Cancelar</button>
        <button class="btn btn-danger btn-block" id="m-confirm">Apagar tudo</button>
      </div>
    `);
    document.getElementById('m-cancel').addEventListener('click', closeModal);
    document.getElementById('m-confirm').addEventListener('click', async ()=>{
      for(const i of S.index){ await safeDelete(keyInsp(i.id)); }
      await saveIndex([]); await saveActionsIndex([]);
      S.index=[]; S.actionsIndex=[];
      closeModal(); navigate('home'); toast('Todos os dados foram apagados');
    });
  });
}

/* ============================= MODAL ============================= */

function openModal(innerHTML){
  const bg = document.createElement('div');
  bg.className='modal-bg'; bg.id='modal-bg';
  bg.innerHTML = `<div class="modal">${innerHTML}</div>`;
  bg.addEventListener('click', e=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.getElementById('modal-bg'); if(m) m.remove(); }

/* ============================= SIGNATURE PAD ============================= */

function openSignaturePad(title, subtitle, onSave){
  openModal(`
    <h3>${escapeHTML(title)}</h3>
    <p style="color:var(--graphite-soft);font-size:13px;margin:4px 0 10px;">${escapeHTML(subtitle||'Assine com o dedo no quadro abaixo.')}</p>
    <canvas id="sig-canvas" style="width:100%;height:200px;background:#fff;border:1.5px dashed var(--line);border-radius:10px;touch-action:none;display:block;"></canvas>
    <div style="display:flex;gap:10px;margin-top:12px;">
      <button class="btn btn-ghost" id="sig-clear">Limpar</button>
      <button class="btn btn-ghost" id="sig-cancel">Cancelar</button>
      <button class="btn btn-primary btn-block" id="sig-ok">Confirmar</button>
    </div>
  `);
  const cv = document.getElementById('sig-canvas');
  const ratio = Math.max(window.devicePixelRatio||1, 1);
  const rect = cv.getBoundingClientRect();
  cv.width = rect.width * ratio; cv.height = rect.height * ratio;
  const ctx = cv.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1d17';
  let drawing = false, hasInk = false, last = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; hasInk = true; e.preventDefault();
  });
  const stop = ()=>{ drawing=false; };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  document.getElementById('sig-clear').addEventListener('click', ()=>{ ctx.clearRect(0,0,cv.width,cv.height); hasInk=false; });
  document.getElementById('sig-cancel').addEventListener('click', closeModal);
  document.getElementById('sig-ok').addEventListener('click', ()=>{
    if(!hasInk){ toast('Faça a assinatura antes de confirmar'); return; }
    const out = document.createElement('canvas');
    out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0,0,out.width,out.height);
    o.drawImage(cv,0,0);
    const data = out.toDataURL('image/jpeg', 0.8);
    closeModal();
    onSave(data);
  });
}

function signatureBlockHTML(opts){
  // opts: {label, name, role, img, btnId, clearId, editable}
  return `
    <div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FDFCF9;">
      <div class="mono" style="font-size:11px;color:var(--graphite-soft);text-transform:uppercase;letter-spacing:.04em;">${escapeHTML(opts.label)}</div>
      ${opts.img
        ? `<img src="${opts.img}" style="width:100%;max-height:110px;object-fit:contain;background:#fff;border-radius:6px;margin:8px 0 4px;">`
        : `<div style="height:70px;display:flex;align-items:center;justify-content:center;color:var(--graphite-soft);font-size:12.5px;border-bottom:1.5px solid var(--graphite-soft);margin:8px 0 4px;">${opts.editable?'Sem assinatura':'Não assinado'}</div>`}
      <div style="border-top:1px solid var(--graphite);padding-top:5px;text-align:center;">
        <div style="font-weight:700;font-size:13.5px;">${escapeHTML(opts.name||'—')}</div>
        <div style="font-size:12px;color:var(--graphite-soft);">${escapeHTML(opts.role||'')}</div>
      </div>
      ${opts.editable?`<div style="display:flex;gap:8px;margin-top:10px;">
        <button type="button" class="btn btn-ghost btn-sm btn-block" id="${opts.btnId}">${opts.img?'Assinar novamente':'Assinar'}</button>
        ${opts.img && opts.clearId?`<button type="button" class="btn btn-danger btn-sm" id="${opts.clearId}">Remover</button>`:''}
      </div>`:''}
    </div>`;
}

/* ============================= UTIL ============================= */

function escapeHTML(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s){ return escapeHTML(s); }

boot();
})();
</script>
